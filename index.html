<!DOCTYPE html>
<html>
  <head>
    <title>Geo Drone</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.16/tailwind.min.css"
    />

    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
  </head>
  <body>
    <div class="flex flex-col justify-center items-center h-screen">
      <div class="mb-8">
        <h1 class="text-4xl mb-2">Geo Drone</h1>
        <p class="text-xl">
          Play a different drone based on your precise location
        </p>
      </div>
      <div>
        <div class="flex flex-row">
        <button
          class="button drum-button rounded-full text-center cursor-pointer"
        >
          <i class="fas fa-play"></i>
        </button>
        <div class="flex mr-16 flex-col	mt-8 ml-20" data-wave='sawtooth' id="wave-toggle">
          <button class="text-left 	" id="sine-toggle"><svg id="sine-icon" height="34" viewBox="0 0 24 24" width="34" xmlns="http://www.w3.org/2000/svg" fill="black"><path d="m16.5 21c-3 0-4.19-4.24-5.45-8.72-.91-3.24-2.05-7.28-3.55-7.28-3.39 0-3.5 6.93-3.5 7h-2c0-.37.06-9 5.5-9 3 0 4.21 4.25 5.47 8.74.86 3.06 2.03 7.26 3.53 7.26 3.44 0 3.53-6.93 3.53-7h2c0 .37-.06 9-5.53 9z"/></svg></button>
          <button class="mt-6 text-left	" id="square-toggle"><svg id="square-icon" xmlns="http://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-wave-square" width="34" height="34" viewBox="0 0 24 24" stroke-width="2" stroke="black" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
            <path d="M3 12h5v8h4v-16h4v8h5" />
          </svg></button>
          <button class="mt-6 text-left	" id="sawtooth-toggle"><svg id="sawtooth-icon"  height="34" viewBox="0 0 24 24" width="34" fill="blue" xmlns="http://www.w3.org/2000/svg"><path d="m11 22v-15.17l-9 9.17v-2.83l11-11.17v15.17l9-9.17v2.83z"/></svg></button>
          <!-- <button class="mt-6 text-left	" id="triangle-toggle">triangle</button> -->
        </div>
      </div>
      </div>
      <div class="flex flex-col items-center">
      <div class="mt-16 text-xl" id="coordinates"></div>
      <div class="mt-4 text-xl" id="note"></div>
      <img class="mt-4" id="audio-wave" src="/audio-wave-static.png" alt="moving wave form" style="width:48px;height:48px;">
      </div>
      <div class="credits-section">
        <a href="https://farfamahar.github.io/">Made my Farfama </a>
      </div>
    </div>
    <script>

            // Create a new AudioContext object
            const audioContext = new AudioContext() || window.webkitAudioContext;

// Get all drum buttons
const drumButtons = document.querySelectorAll(".drum-button");

// Get the coordinates element
const coordinates = document.getElementById("coordinates");
const note = document.getElementById("note");
let isPlaying = false;
let waveDiv = document.getElementById('wave-toggle');
let audioWave = document.getElementById('audio-wave')

// Leading digits of lat/long (degrees) place the drone in the world
const MACRO_DIGIT_COUNT = 2;
// Trailing digits of lat/long (finest decimal places) are what shift as you walk
const MICRO_DIGIT_COUNT = 2;
// How long a voice takes to glide to a new location's pitch
const GLIDE_SECONDS = 4;

// Shared effects chain that every voice runs through:
// lowpass filter (with a slow LFO sweep for movement) -> feedback delay (reverb-like tail) -> output
const masterGain = audioContext.createGain();
masterGain.gain.value = 0.25;

const filter = audioContext.createBiquadFilter();
filter.type = "lowpass";
filter.frequency.value = 800;
filter.Q.value = 0.7;

const filterLFO = audioContext.createOscillator();
filterLFO.frequency.value = 0.06;
const filterLFODepth = audioContext.createGain();
filterLFODepth.gain.value = 300;
filterLFO.connect(filterLFODepth);
filterLFODepth.connect(filter.frequency);
filterLFO.start();

const delay = audioContext.createDelay(2);
delay.delayTime.value = 0.4;
const delayFeedback = audioContext.createGain();
delayFeedback.gain.value = 0.35;
const delayWet = audioContext.createGain();
delayWet.gain.value = 0.3;

filter.connect(masterGain);
masterGain.connect(audioContext.destination);
masterGain.connect(delay);
delay.connect(delayFeedback);
delayFeedback.connect(delay);
delay.connect(delayWet);
delayWet.connect(audioContext.destination);

// Map a 0-9 digit to a low, drone-register frequency
const digitToFrequency = (digit) => 55 + digit * 12;

// Currently sounding voices, one oscillator + gain per chord tone
let voices = [];

// Convert a geolocation position into chord digits + display text.
// Macro digits (lat/long degrees) give the drone a distinct character per
// region of the world; micro digits (finest decimal places) are what drift
// as you walk around within that region.
const getPositionData = (position) => {
  const { latitude, longitude } = position.coords;
  const text = `Latitude : ${latitude.toFixed(
    8
  )}, Longitude: ${longitude.toFixed(8)}`;
  const latitudeDigits = String(latitude.toFixed(8)).match(/\d/g);
  const longitudeDigits = String(longitude.toFixed(8)).match(/\d/g);

  const macroDigits = [
    ...latitudeDigits.slice(0, MACRO_DIGIT_COUNT),
    ...longitudeDigits.slice(0, MACRO_DIGIT_COUNT),
  ];
  const microDigits = [
    ...latitudeDigits.slice(-MICRO_DIGIT_COUNT),
    ...longitudeDigits.slice(-MICRO_DIGIT_COUNT),
  ];

  return { chordDigits: [...macroDigits, ...microDigits], text };
};

let watchId = null;

// Keep tracking location so the drone can keep drifting as you walk
const startLocationWatch = () => {
  if (watchId !== null || !navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(
    (position) => updateDrone(getPositionData(position)),
    (error) => console.error(error),
    { enableHighAccuracy: true }
  );
};

// Glide each voice to the new location's chord instead of retriggering it
const updateDrone = ({ chordDigits, text }) => {
  coordinates.textContent = text;
  note.textContent = chordDigits.join(" ");
  const now = audioContext.currentTime;
  chordDigits.forEach((digit, i) => {
    const voice = voices[i];
    if (!voice) return;
    voice.oscillator.frequency.exponentialRampToValueAtTime(
      digitToFrequency(digit),
      now + GLIDE_SECONDS
    );
  });
};

const startDrone = ({ chordDigits, text }) => {
  coordinates.textContent = text;
  note.textContent = chordDigits.join(" ");
  const waveform = waveDiv.getAttribute('data-wave');
  const now = audioContext.currentTime;

  voices = chordDigits.map((digit, i) => {
    const oscillator = audioContext.createOscillator();
    oscillator.type = waveform;
    oscillator.frequency.value = digitToFrequency(digit);
    // Spread voices slightly out of tune so the drone chorus/beats instead of sounding flat
    oscillator.detune.value = (i - (chordDigits.length - 1) / 2) * 6;

    const gainNode = audioContext.createGain();
    gainNode.gain.setValueAtTime(0, now);
    gainNode.gain.linearRampToValueAtTime(0.6, now + 3);

    oscillator.connect(gainNode);
    gainNode.connect(filter);
    oscillator.start();

    return { oscillator, gainNode };
  });

  audioWave.src = '/wave.gif';
  isPlaying = true;
};

// Fade voices out and stop them, then stop location tracking
const stopDrone = () => {
  const now = audioContext.currentTime;
  voices.forEach(({ oscillator, gainNode }) => {
    gainNode.gain.cancelScheduledValues(now);
    gainNode.gain.setValueAtTime(gainNode.gain.value, now);
    gainNode.gain.linearRampToValueAtTime(0, now + 1.5);
    oscillator.stop(now + 1.6);
    oscillator.onended = () => {
      oscillator.disconnect();
      gainNode.disconnect();
    };
  });
  voices = [];

  isPlaying = false;
  note.textContent = "";
  audioWave.src = '/audio-wave-static.png';

  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }
};

// Event listener for drum buttons (play/stop toggle)
drumButtons.forEach((button) => {
button.addEventListener("click", () => {

if (isPlaying) {
  stopDrone();
  return;
}

if (!navigator.geolocation) {
  alert("Geolocation is not supported by this browser.");
  return;
}

navigator.geolocation.getCurrentPosition((position) => {
  startDrone(getPositionData(position));
  startLocationWatch();
});
});
});


const sineToggle = document.getElementById("sine-toggle");
const sineIcon = document.getElementById("sine-icon");
const squareIcon = document.getElementById("square-icon");
const sawtoothIcon = document.getElementById("sawtooth-icon");


// Apply a waveform change to any voices currently sounding
const setLiveWaveform = (waveform) => {
voices.forEach(({ oscillator }) => {
  oscillator.type = waveform;
});
};

sineToggle.addEventListener("click", () => {
waveDiv.setAttribute('data-wave','sine');
setLiveWaveform('sine');
sineIcon.style.fill = "blue";
squareIcon.style.stroke = "black";
sawtoothIcon.style.fill = "black";


});

const squareToggle = document.getElementById("square-toggle");
squareToggle.addEventListener("click", () => {
waveDiv.setAttribute('data-wave','square');
setLiveWaveform('square');
sineIcon.style.fill = "black";
squareIcon.style.stroke = "blue";
sawtoothIcon.style.fill = "black";

});
const sawtoothToggle = document.getElementById("sawtooth-toggle");
sawtoothToggle.addEventListener("click", () => {
waveDiv.setAttribute('data-wave','sawtooth');
setLiveWaveform('sawtooth');
sineIcon.style.fill = "black";
squareIcon.style.stroke = "black";
sawtoothIcon.style.fill = "blue";

});
// const triangleToggle = document.getElementById("triangle-toggle");
// triangleToggle.addEventListener("click", () => {
// waveDiv.setAttribute('data-wave','triangle');

// });


    </script>
  </body>
</html>
